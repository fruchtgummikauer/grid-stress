[project]
name = "grid-stress"
version = "0.1.0"
description = "Capstone Project on Forecasting the German Power Grid Load & Stability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "statsmodels",
    "mlflow",
    "parsenvy",
    "xgboost>=3.2.0",
    "lightgbm>=4.7.0",
    "holidays>=0.104",
    "requests>=2.34.2",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
    "scipy>=1.17.1",
    "joblib>=1.6.0",
    "plotly>=7.0.0",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "seaborn",
    "pytest",
    "testbook",
    "black",
    "nbdime",
    "missingno>=0.5.2",
    "gh>=0.0.4",
    "imageio-ffmpeg>=0.6.0",
]

[tool.uv]
package = false
