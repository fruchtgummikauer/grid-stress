[project]
name = "grid-stress"
version = "0.1.0"
description = "Capstone Project on Forecasting the German Power Grid Load & Stability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "statsmodels",
    "mlflow",
    "parsenvy",
    "xgboost>=3.2.0",
    "lightgbm>=4.7.0",
    "holidays>=0.104",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "seaborn",
    "pytest",
    "testbook",
    "black",
    "nbdime",
    "plotly>=7.0.0",
    "missingno>=0.5.2",
]

[tool.uv]
package = false
